<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQLLab V4.0 - Laboratorio de SQL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#1a1a1a;background:#f4f6f5;font-size:14px}
.app{display:grid;grid-template-columns:280px 1fr 340px;min-height:100vh}

/* ── Sidebar (verde oscuro) ── */
.sidebar{background:#1c5c39;color:#fff;padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
.brand{font-size:20px;font-weight:700;padding-bottom:10px;border-bottom:1px solid #107C41;letter-spacing:.5px}
.brand span{color:#a6e3b8;font-size:12px;font-weight:500;display:block;margin-top:2px}
.levels-nav{flex:1;overflow-y:auto}
.level-group{margin-bottom:14px}
.level-header{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#9fceb4;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.level-header.locked{color:#5d7a67}
.challenges{list-style:none}
.challenges li{padding:6px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;line-height:1.3;transition:background .1s}
.challenges li:hover:not(.locked){background:#107C41}
.challenges li.active{background:#107C41;font-weight:600;box-shadow:inset 3px 0 0 #a6e3b8}
.challenges li.completed .chk{color:#a6e3b8;font-weight:bold;margin-left:6px}
.challenges li.locked{opacity:.35;cursor:not-allowed}
.challenges li .idbadge{font-size:10px;opacity:.6;margin-right:6px;font-family:monospace}
.instructor-bar{background:rgba(255,255,255,.1);padding:8px 10px;border-radius:6px}
.instructor-bar label{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;user-select:none}
.footer-actions{display:flex;flex-direction:column;gap:6px}
.footer-actions button{width:100%;font-size:12px;padding:7px 10px}

/* ── Main (claro) ── */
.main{padding:20px;min-width:0;overflow-y:auto;max-height:100vh}

/* ── Status strip ── */
.status-strip{display:flex;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:10px 4px;margin-bottom:16px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;text-align:center;padding:4px 8px;border-right:1px solid #eee}
.stat:last-child{border-right:none}
.stat .label{display:block;font-size:9.5px;text-transform:uppercase;color:#666;letter-spacing:.5px;margin-bottom:2px;font-weight:600}
.stat .value{font-size:16px;font-weight:700;color:#107C41}

/* ── Challenge panel ── */
.challenge-panel{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:20px}
.challenge-panel h1{font-size:21px;color:#1c5c39;margin-bottom:4px}
.challenge-meta{color:#6d89af;font-size:12px;margin-bottom:14px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.section-block{margin-bottom:14px}
.section-block h3{font-size:12px;text-transform:uppercase;color:#424853;margin-bottom:5px;letter-spacing:.5px;font-weight:700}
.section-block p{color:#333;line-height:1.55;font-size:13.5px}

/* ── Editor ── */
.editor-wrap label{display:block;font-size:12px;text-transform:uppercase;color:#424853;margin-bottom:6px;letter-spacing:.5px;font-weight:700}
#editor{width:100%;min-height:140px;padding:12px;font-family:'Consolas','Menlo','Courier New',monospace;font-size:13px;border:1px solid #c0c8d0;border-radius:6px;resize:vertical;background:#fafbfc;line-height:1.5;color:#1c5c39}
#editor:focus{outline:none;border-color:#107C41;box-shadow:0 0 0 2px rgba(16,124,65,.15)}
.editor-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ── Botones ── */
button{padding:8px 14px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#107C41;color:#fff}.btn-primary:hover:not(:disabled){background:#1c5c39}
.btn-secondary{background:#6d89af;color:#fff}.btn-secondary:hover:not(:disabled){background:#56749a}
.btn-warn{background:#d4a017;color:#fff}.btn-warn:hover:not(:disabled){background:#b08612}
.btn-danger{background:#b03030;color:#fff}.btn-danger:hover:not(:disabled){background:#8a2525}
.btn-ghost{background:#eef4f4;color:#424853}.btn-ghost:hover:not(:disabled){background:#dde3e8}

/* ── Feedback ── */
.feedback{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:13px;line-height:1.4;display:none}
.feedback.show{display:block}
.feedback.ok{background:#e8f5ec;color:#1c5c39;border-left:4px solid #107C41}
.feedback.err{background:#fceaea;color:#b03030;border-left:4px solid #b03030}
.feedback.info{background:#eef2f8;color:#3b5580;border-left:4px solid #6d89af}

/* ── Result table ── */
.result-wrap{margin-top:16px}
.result-wrap h3{font-size:12px;text-transform:uppercase;color:#424853;margin-bottom:8px;letter-spacing:.5px;font-weight:700}
.result-table{overflow-x:auto;border:1px solid #e8ecef;border-radius:6px;max-height:300px;overflow-y:auto}
.result-table table{border-collapse:collapse;width:100%;font-size:13px}
.result-table th{background:#e8f3ed;color:#1c5c39;text-align:left;padding:8px 10px;border-bottom:2px solid #107C41;font-weight:700;position:sticky;top:0}
.result-table td{padding:6px 10px;border-bottom:1px solid #eee;font-family:'Consolas',monospace;font-size:12.5px;color:#333}
.result-table tr:hover td{background:#f8fbf9}
.result-table .null{color:#999;font-style:italic}

/* ── Right panel ── */
.right-panel{background:#fff;border-left:1px solid #e0e0e0;padding:16px;position:sticky;top:0;max-height:100vh;overflow-y:auto;font-size:13px}
.right-panel h3{font-size:11px;text-transform:uppercase;color:#424853;margin:16px 0 8px;letter-spacing:.7px;font-weight:700}
.right-panel h3:first-child{margin-top:0}
.stat-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:12.5px}
.stat-row b{color:#107C41}
#rp-schema{background:#f4f6f5;padding:10px;border-radius:4px;font-size:10.5px;overflow-x:auto;max-height:220px;overflow-y:auto;font-family:'Consolas',monospace;line-height:1.5;white-space:pre;color:#333}
.hints-list{display:flex;flex-direction:column;gap:6px}
.hint-item{background:#fff8e1;border-left:3px solid #d4a017;padding:8px 10px;border-radius:4px;font-size:12px;line-height:1.45;color:#5a4a10}
.hint-locked{background:#f4f6f5;border-left:3px solid #ccc;color:#999;font-style:italic}

/* ── Exam banner ── */
.exam-banner{background:#fff8e1;border:1px solid #d4a017;padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:13px;color:#7a5a00;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.exam-banner b{color:#5a4000}
.exam-banner button{font-size:12px;padding:5px 10px}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-overlay.hidden{display:none}
.modal{background:#fff;border-radius:10px;padding:24px;max-width:480px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:85vh;overflow-y:auto}
.modal h3{color:#1c5c39;margin-bottom:12px;font-size:18px}
.modal-body{color:#333;font-size:14px;line-height:1.55;margin-bottom:18px}
.modal-body p{margin-bottom:8px}
.modal-body ul{margin-left:20px;line-height:1.7}
.modal-body table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.modal-body th{text-align:left;padding:5px;border-bottom:1px solid #ccc;background:#e8f3ed;color:#1c5c39}
.modal-body td{padding:5px;border-bottom:1px solid #eee}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-input{width:100%;padding:9px 12px;border:1px solid #c0c8d0;border-radius:6px;font-size:14px;margin-top:8px;font-family:inherit}
.modal-input:focus{outline:none;border-color:#107C41;box-shadow:0 0 0 2px rgba(16,124,65,.15)}

/* ── Welcome ── */
.welcome{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:32px;text-align:center}
.welcome h1{color:#1c5c39;margin-bottom:12px}
.welcome p{color:#555;margin-bottom:8px;line-height:1.6}

/* ── Utility ── */
.hidden{display:none!important}

@media (max-width:1100px){
  .app{grid-template-columns:1fr}
  .sidebar,.right-panel{position:static;max-height:none}
  .right-panel{border-left:none;border-top:1px solid #e0e0e0}
  .main{max-height:none}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">SQLLab V4.0<span>Práctica real de SQL</span></div>
    <div class="levels-nav" id="levelsNav"></div>
    <div class="instructor-bar">
      <label><input type="checkbox" id="instructorMode"> Modo instructor</label>
    </div>
    <div class="footer-actions">
      <button class="btn-secondary" id="btnExam">🎯 Examen</button>
      <button class="btn-ghost" id="btnReport">📄 Reporte HTML</button>
      <button class="btn-ghost" id="btnClearLog">🧹 Borrar bitácora</button>
      <button class="btn-danger" id="btnResetAll">⚠️ Reiniciar TODO</button>
    </div>
  </aside>

  <main class="main">
    <header class="status-strip">
      <div class="stat"><span class="label">Tiempo</span><span class="value" id="stat-time">00:00</span></div>
      <div class="stat"><span class="label">Intentos</span><span class="value" id="stat-attempts">0</span></div>
      <div class="stat"><span class="label">Pistas</span><span class="value" id="stat-hints">0</span></div>
      <div class="stat"><span class="label">Puntos</span><span class="value" id="stat-points">0</span></div>
      <div class="stat"><span class="label">Estado</span><span class="value" id="stat-state">—</span></div>
      <div class="stat"><span class="label">Progreso</span><span class="value" id="stat-progress">0/30</span></div>
    </header>
    <div id="challengeArea"></div>
  </main>

  <aside class="right-panel" id="rightPanel">
    <h3>Detalles del reto</h3>
    <div class="stat-row"><span>Puntos base</span><b>100</b></div>
    <div class="stat-row"><span>Intentos</span><b id="rp-attempts">—</b></div>
    <div class="stat-row"><span>Fallos</span><b id="rp-failures">—</b></div>
    <div class="stat-row"><span>Pistas usadas</span><b id="rp-hints">—</b></div>
    <div class="stat-row"><span>Mejor puntuación</span><b id="rp-best">—</b></div>
    <div class="stat-row"><span>Primer intento</span><b id="rp-first">—</b></div>
    <h3>Schema cargado</h3>
    <pre id="rp-schema">Selecciona un reto</pre>
    <h3>Pistas reveladas</h3>
    <div id="rp-hints-list" class="hints-list"><div class="hint-locked hint-item">Sin pistas usadas</div></div>
  </aside>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="modal-cancel">Cancelar</button>
      <button class="btn-primary" id="modal-confirm">Aceptar</button>
    </div>
  </div>
</div>

<script>
  /* ═══════════════════════════════════════════════════════════
   BLOQUE 2 · HELPERS + STATE + SCORING + MODALES
   ═══════════════════════════════════════════════════════════ */

/* ── Helpers básicos ── */
const $ = id => document.getElementById(id);
const escapeHtml = str => String(str).replace(/[&<>"']/g,
  ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmtTime = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');

/* ── CHALLENGES · puente con los arrays ── */
const CHALLENGES = { basico: [], intermedio: [], avanzado: [] };
function initChallenges(){
  if(typeof BASIC !== 'undefined') CHALLENGES.basico     = BASIC;
  if(typeof INTER !== 'undefined') CHALLENGES.intermedio = INTER;
  if(typeof ADV   !== 'undefined') CHALLENGES.avanzado   = ADV;
}

/* ── Niveles ── */
const LEVELS = {
  1: { name: 'Básico',     key: 'basico',     requires: null },
  2: { name: 'Intermedio', key: 'intermedio', requires: { level: 1, minCompleted: 4 } },
  3: { name: 'Avanzado',   key: 'avanzado',   requires: { level: 2, minCompleted: 4 } }
};

/* ── Estado persistente ── */
const STORAGE_KEY = 'sqllab_v2_state';
let State = {};
let instructorMode = false;

function emptyChallengeState(){
  return {
    attempts: 0,
    failures: 0,
    hintsUsed: 0,
    solutionViewed: false,
    solved: false,
    solvedAt: null,
    bestScore: null,
    firstAttempt: null
  };
}
function getState(id){
  if(!State[id]) State[id] = emptyChallengeState();
  return State[id];
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(State)); }
  catch(e){ console.warn('No se pudo guardar el estado:', e); }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    State = raw ? (JSON.parse(raw) || {}) : {};
  }catch(e){
    console.warn('Estado corrupto, se reinicia:', e);
    State = {};
  }
}

/* ── Scoring (base 100) ──
     −100 por pista
     −50  por intento fallido
     −10  si se reveló la solución
     mínimo 0
   ─────────────────────────────────── */
function computeScore(s){
  const raw = 100
    - 100 * (s.hintsUsed || 0)
    - 50  * (s.failures  || 0)
    - (s.solutionViewed ? 10 : 0);
  return Math.max(0, raw);
}

/* ── Registro de acciones ── */
function registerAttempt(challengeId, correct){
  const s = getState(challengeId);
  s.attempts++;
  if(correct){
    s.solved = true;
    if(!s.solvedAt) s.solvedAt = Date.now();
    const score = computeScore(s);
    if(s.bestScore === null || score > s.bestScore) s.bestScore = score;
    if(s.firstAttempt === null){
      s.firstAttempt = {
        score,
        hintsUsed: s.hintsUsed,
        failures: s.failures,
        solutionViewed: s.solutionViewed,
        solvedAt: s.solvedAt
      };
    }
  } else {
    s.failures++;
  }
  saveState();
  return s;
}

function registerHint(challengeId){
  const s = getState(challengeId);
  s.hintsUsed++;
  saveState();
  return s.hintsUsed;
}

function registerSolutionView(challengeId){
  const s = getState(challengeId);
  s.solutionViewed = true;
  if(!s.solved){
    s.solved = true;
    s.solvedAt = Date.now();
    const score = computeScore(s);
    if(s.bestScore === null || score > s.bestScore) s.bestScore = score;
  }
  if(s.firstAttempt === null){
    s.firstAttempt = {
      score: computeScore(s),
      hintsUsed: s.hintsUsed,
      failures: s.failures,
      solutionViewed: true,
      solvedAt: s.solvedAt || Date.now()
    };
  }
  saveState();
  return s;
}

/* ── Bitácora / Reset ── */
function clearBitacora(){
  for(const arr of Object.values(CHALLENGES))
    for(const c of arr){
      const s = getState(c.id);
      s.attempts = 0;
      s.failures = 0;
      s.hintsUsed = 0;
      s.solutionViewed = false;
    }
  saveState();
}

function resetAll(){
  State = {};
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

/* ── Desbloqueo ── */
function countSolvedInLevel(levelKey){
  return (CHALLENGES[levelKey] || []).filter(c => getState(c.id).solved).length;
}
function isLevelUnlocked(levelNum){
  if(instructorMode) return true;
  if(levelNum === 1) return true;
  const req = LEVELS[levelNum].requires;
  return countSolvedInLevel(LEVELS[req.level].key) >= req.minCompleted;
}
function levelOfChallenge(challenge){
  for(const [num, lvl] of Object.entries(LEVELS))
    if((CHALLENGES[lvl.key] || []).some(c => c.id === challenge.id)) return Number(num);
  return 1;
}
function isChallengeUnlocked(challenge){
  return isLevelUnlocked(levelOfChallenge(challenge));
}

/* ── Métricas globales ── */
function getProgress(){
  let solved = 0, total = 0;
  for(const arr of Object.values(CHALLENGES))
    for(const c of arr){
      total++;
      if(getState(c.id).solved) solved++;
    }
  return { solved, total };
}
function getTotalPoints(){
  let sum = 0;
  for(const arr of Object.values(CHALLENGES))
    for(const c of arr){
      const s = getState(c.id);
      if(s.bestScore !== null) sum += s.bestScore;
    }
  return sum;
}
function getTotalAttempts(){
  let sum = 0;
  for(const arr of Object.values(CHALLENGES))
    for(const c of arr) sum += getState(c.id).attempts;
  return sum;
}
function getTotalHints(){
  let sum = 0;
  for(const arr of Object.values(CHALLENGES))
    for(const c of arr) sum += getState(c.id).hintsUsed;
  return sum;
}

/* ── Formato ── */
function formatScore(n){ return n === null ? '—' : String(n); }
function formatFirstAttempt(f){ return f ? f.score + ' pts' : '—'; }

/* ── Timer ── */
let timerInterval = null;
let secondsElapsed = 0;
let timerRunning = false;

function updateTimerDisplay(){
  const el = $('stat-time');
  if(el) el.textContent = fmtTime(secondsElapsed);
}
function startTimer(){
  if(timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(() => { secondsElapsed++; updateTimerDisplay(); }, 1000);
}
function stopTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  timerRunning = false;
}
function resetTimer(){
  stopTimer();
  secondsElapsed = 0;
  updateTimerDisplay();
}

/* ── Ejecución del SQL del alumno ── */
function runUserSQL(sql){
  const trimmed = (sql || '').trim();
  if(!trimmed){
    return { columns: [], values: [], error: 'La consulta está vacía. Escribe un SELECT.' };
  }
  try{
    const r = sqlRun(trimmed, DB);
    return {
      ast: r.ast,
      columns: r.columns,
      values: r.rows.map(row => r.columns.map(c => row[c])),
      error: null
    };
  } catch(e){
    let msg = (e && e.message) ? e.message : String(e);
    msg = msg.replace(/^Error:\s*/i, '');
    return { columns: [], values: [], error: msg };
  }
}

/* ── Schema textual del reto (para right-panel) ── */
function schemaTextFor(tables){
  if(!tables || !tables.length) return '—';
  return tables.map(t => {
    const tb = (typeof DB !== 'undefined' && DB[t]) ? DB[t] : null;
    if(!tb) return 'CREATE TABLE ' + t + ' (... no encontrada);';
    return 'CREATE TABLE ' + t + ' (\n  ' + tb.columns.join(',\n  ') + '\n);';
  }).join('\n\n');
}

/* ═══════════════════════════════════════════════════════════
   MODAL (patrón SQLLab original)
   ═══════════════════════════════════════════════════════════ */
const RESET_PASSWORD = 'sql2024';

let modalResolver = null;
let modalInputValidator = null;

function openModal({ title, body, confirmText = 'Aceptar', cancelText = 'Cancelar', danger = false, input = null }){
  return new Promise(resolve => {
    modalResolver = resolve;
    modalInputValidator = (input && typeof input.validate === 'function') ? input.validate : null;

    $('modal-title').textContent = title;
    const bodyEl = $('modal-body');
    bodyEl.innerHTML = body;

    if(input){
      const inputEl = document.createElement('input');
      inputEl.type = input.type || 'text';
      inputEl.id = 'modal-input';
      inputEl.className = 'modal-input';
      inputEl.placeholder = input.placeholder || '';
      inputEl.setAttribute('autocomplete', 'off');
      bodyEl.appendChild(inputEl);

      const errEl = document.createElement('div');
      errEl.id = 'modal-error';
      errEl.style.cssText = 'color:#b03030;font-size:12.5px;margin-top:6px;min-height:16px;';
      bodyEl.appendChild(errEl);

      setTimeout(() => inputEl.focus(), 50);
    } else {
      setTimeout(() => $('modal-confirm').focus(), 50);
    }

    const confirmBtn = $('modal-confirm');
    const cancelBtn  = $('modal-cancel');
    confirmBtn.textContent = confirmText;
    confirmBtn.className   = danger ? 'btn-danger' : 'btn-primary';
    cancelBtn.textContent  = cancelText;

    $('modal-overlay').classList.remove('hidden');
  });
}

function closeModal(result){
  $('modal-overlay').classList.add('hidden');
  if(modalResolver){
    const r = modalResolver;
    modalResolver = null;
    modalInputValidator = null;
    r(result);
  }
}

$('modal-confirm').addEventListener('click', () => {
  const inputEl = $('modal-input');
  if(inputEl){
    const v = inputEl.value;
    if(modalInputValidator){
      const err = modalInputValidator(v);
      if(err){
        const errEl = $('modal-error');
        if(errEl) errEl.textContent = err;
        inputEl.focus();
        inputEl.select();
        return;
      }
    }
    closeModal(v);
  } else {
    closeModal(true);
  }
});

$('modal-cancel').addEventListener('click', () => closeModal(null));

document.addEventListener('keydown', (e) => {
  const overlay = $('modal-overlay');
  if(!overlay || overlay.classList.contains('hidden')) return;
  if(e.key === 'Escape'){
    e.preventDefault();
    closeModal(null);
  } else if(e.key === 'Enter'){
    const inputEl = $('modal-input');
    if(inputEl && document.activeElement === inputEl){
      e.preventDefault();
      $('modal-confirm').click();
    }
  }
});

function confirmModal({ title, body, confirmText = 'Aceptar', cancelText = 'Cancelar', danger = false }){
  return openModal({ title, body, confirmText, cancelText, danger });
}
function passwordModal({ title, body, confirmText = 'Confirmar', password }){

/* ── Comparación de resultados ── */
function normVal(v){
  if(v === null || v === undefined) return null;
  if(typeof v === 'number') return Math.round(v * 1e6) / 1e6;
  return String(v);
}
function sqlCheck(result, expectedSql, opts = {}){
  let expected;
  try { expected = sqlRun(expectedSql, DB); }
  catch(e){ return {ok: false, msg: 'Error interno: ' + e.message}; }

  if(result.columns.length !== expected.columns.length){
    return {ok: false, msg: 'Se esperaban ' + expected.columns.length +
      ' columna(s), tu consulta devuelve ' + result.columns.length + '.'};
  }
  if(result.rows.length !== expected.rows.length){
    return {ok: false, msg: 'Se esperaban ' + expected.rows.length +
      ' fila(s), tu consulta devuelve ' + result.rows.length + '.'};
  }

  const mapped = result.rows.map(r =>
    expected.columns.map((_, i) => normVal(r[result.columns[i]]))
  );
  const target = expected.rows.map(r =>
    expected.columns.map(c => normVal(r[c]))
  );

  if(opts.ordered){
    if(JSON.stringify(mapped) === JSON.stringify(target))
      return {ok: true, msg: '¡Correcto!'};
    const aS = mapped.map(r => JSON.stringify(r)).sort();
    const tS = target.map(r => JSON.stringify(r)).sort();
    if(JSON.stringify(aS) === JSON.stringify(tS))
      return {ok: false, msg: 'Los datos son correctos pero el ORDEN no. Revisa tu ORDER BY.'};
    return {ok: false, msg: 'El contenido no coincide con lo esperado.'};
  }

  const aS = mapped.map(r => JSON.stringify(r)).sort();
  const tS = target.map(r => JSON.stringify(r)).sort();
  if(JSON.stringify(aS) !== JSON.stringify(tS)){
    return {ok: false, msg: 'Las filas devueltas no coinciden con lo esperado.'};
  }
  return {ok: true, msg: '¡Correcto!'};
}

/* ── Ejecución del SQL del alumno ── */
function runUserSQL(sql){
  const trimmed = (sql || '').trim();
  if(!trimmed){
    return { columns: [], rows: [], error: 'La consulta está vacía. Escribe un SELECT.', ast: null };
  }
  try{
    const r = sqlRun(trimmed, DB);
    return { ast: r.ast, columns: r.columns, rows: r.rows, error: null };
  } catch(e){
    let msg = (e && e.message) ? e.message : String(e);
    msg = msg.replace(/^Error:\s*/i, '');
    return { columns: [], rows: [], error: msg, ast: null };
  }
}

/* ── validateQuery · contrato uniforme para acciones y examen ── */
function validateQuery(challenge, userSQL){
  const exec = runUserSQL(userSQL);
  if(exec.error){
    return { correct: false, reason: 'error', message: 'Error de SQL: ' + exec.error, actual: exec };
  }
  let r;
  try{ r = challenge.check(exec, exec.ast); }
  catch(e){ return { correct: false, reason: 'internal',
                     message: 'Error al validar: ' + e.message, actual: exec }; }
  return {
    correct: !!r.ok,
    reason: r.ok ? 'ok' : 'values',
    message: r.msg || '',
    actual: exec
  };
}

      return sqlCheck(result,

/* ═══════════════════════════════════════════════════════════
   BLOQUE 5 · UI: RENDERS
   ═══════════════════════════════════════════════════════════ */

/* ── Estado de UI (efímero, no se persiste) ── */
const uiState = {
  currentChallengeId: null,
  currentSQL: '',
  lastResult: null,
  showSolution: false,
  feedback: null
};

/* ── Búsqueda de retos ── */
function getCurrentChallenge(){
  if(!uiState.currentChallengeId) return null;
  for(const arr of Object.values(CHALLENGES))
    for(const c of arr) if(c.id === uiState.currentChallengeId) return c;
  return null;
}
function getFirstUnlockedChallenge(){
  for(const [numStr, lvl] of Object.entries(LEVELS)){
    if(!isLevelUnlocked(Number(numStr))) continue;
    const arr = CHALLENGES[lvl.key] || [];
    for(const c of arr) if(!getState(c.id).solved) return c;
    if(arr[0]) return arr[0];
  }
  return null;
}

/* ── Orquestador ── */
function renderApp(){
  renderSidebar();
  renderStatus();
  renderRightPanel();
  renderChallenge();
}

/* ── Sidebar ── */
function renderSidebar(){
  const nav = $('levelsNav');
  if(!nav) return;
  nav.innerHTML = '';

  for(const [numStr, lvl] of Object.entries(LEVELS)){
    const num = Number(numStr);
    const challenges = CHALLENGES[lvl.key] || [];
    const unlocked = isLevelUnlocked(num);
    const solvedCount = countSolvedInLevel(lvl.key);

    const group = document.createElement('div');
    group.className = 'level-group';

    const header = document.createElement('div');
    header.className = 'level-header' + (unlocked ? '' : ' locked');
    header.innerHTML =
      '<span>' + (unlocked ? '' : '🔒 ') + num + '. ' + lvl.name + '</span>' +
      '<span>' + solvedCount + '/' + challenges.length + '</span>';
    group.appendChild(header);

    const list = document.createElement('ul');
    list.className = 'challenges';

    for(const c of challenges){
      const s = getState(c.id);
      const isActive = c.id === uiState.currentChallengeId;
      const isLocked = !unlocked;

      const li = document.createElement('li');
      li.className = [
        isActive ? 'active' : '',
        s.solved ? 'completed' : '',
        isLocked ? 'locked' : ''
      ].filter(Boolean).join(' ');

      li.innerHTML =
        '<span><span class="idbadge">' + c.id + '</span>' + escapeHtml(c.title) + '</span>' +
        (s.solved ? '<span class="chk">✓</span>' : '');

      if(!isLocked){
        li.addEventListener('click', () => {
          uiState.currentChallengeId = c.id;
          uiState.currentSQL = '';
          uiState.lastResult = null;
          uiState.showSolution = false;
          uiState.feedback = null;
          renderApp();
        });
      }
      list.appendChild(li);
    }

    group.appendChild(list);
    nav.appendChild(group);
  }

  /* En examen: bloquear navegación lateral */
  if(typeof examState !== 'undefined' && examState.active){
    const instr = document.querySelector('.instructor-bar');
    const footer = document.querySelector('.footer-actions');
    if(instr) instr.style.display = 'none';
    if(footer) footer.style.display = 'none';

    document.querySelectorAll('.challenges li').forEach(li => {
      if(!li.classList.contains('active')){
        li.style.pointerEvents = 'none';
        li.style.opacity = '0.4';
      }
    });
  }
}

/* ── Status strip ── */
function renderStatus(){
  const { solved, total } = getProgress();
  const s = uiState.currentChallengeId ? getState(uiState.currentChallengeId) : null;

  updateTimerDisplay();
  $('stat-attempts').textContent = getTotalAttempts();
  $('stat-hints').textContent    = getTotalHints();
  $('stat-points').textContent   = getTotalPoints();
  $('stat-state').textContent    = s
    ? (s.solved ? '✓ Resuelto' : (s.attempts > 0 ? 'En curso' : 'Nuevo'))
    : '—';
  $('stat-progress').textContent = solved + '/' + total;
}

/* ── Right panel ── */
function renderRightPanel(){
  const c = getCurrentChallenge();
  const set = (id, val) => { const el = $(id); if(el) el.textContent = val; };

  if(!c){
    set('rp-attempts', '—'); set('rp-failures', '—'); set('rp-hints', '—');
    set('rp-best', '—');     set('rp-first', '—');
    set('rp-schema', 'Selecciona un reto');
    const hl = $('rp-hints-list');
    if(hl) hl.innerHTML = '<div class="hint-locked hint-item">Sin pistas usadas</div>';
    return;
  }

  const s = getState(c.id);
  set('rp-attempts', s.attempts);
  set('rp-failures', s.failures);
  set('rp-hints',    s.hintsUsed + '/' + (c.hints || []).length);
  set('rp-best',     formatScore(s.bestScore));
  set('rp-first',    formatFirstAttempt(s.firstAttempt));
  set('rp-schema',   schemaTextFor(c.tables));

  const hl = $('rp-hints-list');
  if(!hl) return;
  if(s.hintsUsed === 0){
    hl.innerHTML = '<div class="hint-locked hint-item">Sin pistas usadas</div>';
  } else {
    hl.innerHTML = (c.hints || []).slice(0, s.hintsUsed)
      .map((h, i) => '<div class="hint-item"><b>Pista ' + (i + 1) + ':</b> ' + escapeHtml(h) + '</div>')
      .join('');
  }
}

/* ── Panel central del reto ── */
function renderChallenge(){
  const area = $('challengeArea');
  if(!area) return;

  const c = getCurrentChallenge();
  if(!c){
    area.innerHTML =
      '<div class="welcome">' +
      '<h1>Bienvenido a SQLLab V1.0</h1>' +
      '<p>Selecciona un reto en la barra lateral para comenzar.</p>' +
      '<p style="font-size:12px;color:#888;margin-top:12px">' +
      'Cada reto ejecuta tu SQL contra una base de datos SQLite en memoria.</p>' +
      '</div>';
    return;
  }

  const s = getState(c.id);
  const lvl = levelOfChallenge(c);
  const totalHints = (c.hints || []).length;

  /* ── Estado "iniciado" · en examen siempre se considera iniciado ── */
  const started = examState.active || uiState.challengeStarted === true;

  let html = '<div class="challenge-panel' + (started ? '' : ' challenge-locked') + '">';

  html += '<h1>' + escapeHtml(c.title) + '</h1>';
  html += '<div class="challenge-meta">Nivel ' + lvl + ' · ' + c.id + ' · ' +
          (s.solved ? '✓ resuelto' : 'pendiente') + '</div>';

  /* ── Banner "Iniciar reto" (solo en práctica, no en examen) ── */
  if(!examState.active && !started){
    html += '<div class="start-banner">' +
              '<span>⏱ Cronómetro detenido. Pulsa <b>Iniciar reto</b> cuando estés listo para empezar.</span>' +
              '<button class="btn-primary" data-action="start-challenge">▶ Iniciar reto</button>' +
            '</div>';
  }

  html += '<div class="section-block"><h3>Contexto</h3><p>' + escapeHtml(c.brief) + '</p></div>';
  html += '<div class="section-block"><h3>Tarea</h3><p>' + escapeHtml(c.task) + '</p></div>';

  html += '<div class="editor-wrap">';
  html += '<label for="editor">Editor SQL</label>';
  html += '<textarea id="editor" spellcheck="false" placeholder="-- Escribe tu consulta SQL aquí..."' +
          (started ? '' : ' disabled') + '>' +
          escapeHtml(uiState.currentSQL) + '</textarea>';
  html += '<div class="editor-actions">';
  html += '<button type="button" class="btn-primary"  data-action="run"' +
          (started ? '' : ' disabled') + '>▶ Ejecutar</button>';
  html += '<button type="button" class="btn-warn"     data-action="hint" ' +
          (s.hintsUsed >= totalHints || !started ? 'disabled' : '') + '>💡 Pista ' +
          s.hintsUsed + '/' + totalHints + '</button>';
  html += '<button type="button" class="btn-ghost"    data-action="solution" ' +
          (s.solutionViewed || !started ? 'disabled' : '') + '>👁 Ver solución</button>';
  html += '<button type="button" class="btn-secondary" data-action="next">Siguiente →</button>';
  html += '</div></div>';

  if(uiState.feedback){
    html += '<div class="feedback show ' + uiState.feedback.type + '">' +
            escapeHtml(uiState.feedback.message) + '</div>';
  }

  if(uiState.showSolution){
    html += '<div class="result-wrap"><h3>Solución de referencia</h3>';
    html += '<pre style="white-space:pre-wrap;padding:12px;background:#f4f6f5;border-radius:6px;' +
            'font-family:Consolas,monospace;font-size:12.5px;color:#1c5c39">' +
            escapeHtml(c.solution) + '</pre>';
    html += '</div>';
  }

  const r = uiState.lastResult;
  if(r){
    if(r.error){
      /* el feedback ya cubre el caso de error */
    } else if(!r.rows || r.rows.length === 0){
      html += '<div class="result-wrap"><h3>Resultado</h3>';
      html += '<div class="feedback show info">La consulta no devolvió filas.</div>';
      html += '</div>';
    } else if(r.columns && r.columns.length > 0){
      html += '<div class="result-wrap"><h3>Resultado (' + r.rows.length +
              ' fila' + (r.rows.length === 1 ? '' : 's') + ')</h3>';
      html += '<div class="result-table"><table><thead><tr>';
      for(const col of r.columns) html += '<th>' + escapeHtml(col) + '</th>';
      html += '</tr></thead><tbody>';
      for(const row of r.rows){
        html += '<tr>';
        for(const col of r.columns){
          const cell = row[col];
          const isNull = cell === null || cell === undefined;
          html += '<td>' + (isNull ? '<span class="null">NULL</span>'
                                   : escapeHtml(String(cell))) + '</td>';
        }
        html += '</tr>';
      }
      html += '</tbody></table></div></div>';
    }
  }

  html += '</div>';
  area.innerHTML = html;

  /* Listener del editor (preserva texto entre re-renders) */
  const ed = $('editor');
  if(ed && started){
    ed.addEventListener('input', () => { uiState.currentSQL = ed.value; });
    if(uiState.currentSQL){
      ed.focus();
      ed.setSelectionRange(ed.value.length, ed.value.length);
    }
  }
}
/* ── Modo instructor ── */
document.addEventListener('change', (e) => {
  if(e.target && e.target.id === 'instructorMode'){
    instructorMode = e.target.checked;
    renderApp();
  }
});

const examState = {

   Acciones CORE (sin conocimiento del examen)
   ═══════════════════════════════════════════════════════════ */
function _actionRunCore(){
  const c = getCurrentChallenge();
  if(!c) return;
  const sql = ($('editor')?.value ?? uiState.currentSQL ?? '').trim();
  uiState.currentSQL = sql;

  if(!sql){
    uiState.feedback = { type:'err', message:'Escribe una consulta antes de ejecutar.' };
    renderApp();
    return;
  }

  startTimer();
  const result = validateQuery(c, sql);
  uiState.lastResult = result.actual;

  if(result.correct){
    registerAttempt(c.id, true);
    uiState.feedback = {
      type:'ok',
      message:'¡Correcto! Tu consulta produce el resultado esperado.'
    };
  } else {
    registerAttempt(c.id, false);
    let msg = result.message;
    if(result.reason === 'error') msg = 'Error de SQL: ' + msg;
    uiState.feedback = { type:'err', message: msg };
  }
  renderApp();
}

function _actionHintCore(){
  const c = getCurrentChallenge();
  if(!c) return;
  const s = getState(c.id);
  if(s.hintsUsed >= (c.hints || []).length) return;
  registerHint(c.id);
  renderApp();
}

function _actionSolutionCore(){
  const c = getCurrentChallenge();
  if(!c) return;
  const s = getState(c.id);
  if(s.solutionViewed) return;
  registerSolutionView(c.id);
  uiState.showSolution = true;
  uiState.feedback = {
    type:'info',
    message:'Has revelado la solución (−10 pts). Intenta entenderla y repetir el reto sin mirarla.'
  };
  renderApp();
}

function _actionNextCore(){
  const c = getCurrentChallenge();
  if(!c) return;

  const lvl = levelOfChallenge(c);
  const arr = CHALLENGES[LEVELS[lvl].key];
  const idx = arr.findIndex(x => x.id === c.id);

  for(let i = idx + 1; i < arr.length; i++){
    if(isChallengeUnlocked(arr[i])){ goToChallenge(arr[i].id); return; }
  }
  for(let n = lvl + 1; n <= 3; n++){
    if(isLevelUnlocked(n)){
      const next = CHALLENGES[LEVELS[n].key];
      if(next && next.length){ goToChallenge(next[0].id); return; }
    } else {
      const req = LEVELS[n].requires;
      uiState.feedback = {
        type:'info',
        message:'Nivel ' + n + ' bloqueado: completa al menos ' + req.minCompleted +
                ' retos del Nivel ' + req.level + '.'
      };
      renderApp();
      return;
    }
  }
  uiState.feedback = {
    type:'info',
    message:'¡Felicidades! No hay más retos desbloqueados. Activa Modo instructor para ver todo.'
  };
  renderApp();
}

function goToChallenge(id){
  uiState.currentChallengeId = id;
  uiState.currentSQL = '';
  uiState.lastResult = null;
  uiState.showSolution = false;
  uiState.feedback = null;
  renderApp();
}

/* ═══════════════════════════════════════════════════════════
   Dispatchers (exam-aware)
   ═══════════════════════════════════════════════════════════ */
function actionRun(){
  if(examState.active && typeof actionRunExam === 'function') return actionRunExam();
  return _actionRunCore();
}
function actionHint(){
  if(examState.active) return;
  return _actionHintCore();
}
function actionSolution(){
  if(examState.active) return;
  return _actionSolutionCore();
}
function actionNext(){
  if(examState.active && typeof actionNextExam === 'function') return actionNextExam();
  return _actionNextCore();
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if(!btn || btn.disabled) return;
  const action = btn.getAttribute('data-action');
  switch(action){
    case 'run':      actionRun();      break;
    case 'hint':     actionHint();     break;
    case 'solution': actionSolution(); break;
    case 'next':     actionNext();     break;
  }
});

document.addEventListener('keydown', (e) => {
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    const t = e.target;
    if(t && t.id === 'editor'){
      e.preventDefault();
      actionRun();
    }
  }
});

   BLOQUE 7 · EXAMEN + REPORTES + INIT + CIERRE
   ═══════════════════════════════════════════════════════════ */

const EXAM_SIZES = [3, 5, 8, 15];

function getUnlockedPool(){
  const pool = [];
  for(const [numStr, lvl] of Object.entries(LEVELS)){
    if(!isLevelUnlocked(Number(numStr))) continue;
    for(const c of CHALLENGES[lvl.key] || []) pool.push(c);
  }
  return pool;
}

function startExam(n){
  const pool = getUnlockedPool();
  if(pool.length < n){
    openModal({
      title: '🎯 Examen no disponible',
      body:
        '<p>Necesitas al menos <b>' + n + '</b> retos desbloqueados para un examen de ' + n + ' preguntas.</p>' +
        '<p>Actualmente tienes <b>' + pool.length + '</b> retos accesibles.</p>' +
        '<p>Completa más retos del Nivel 1 (y del Nivel 2 si aplica) o activa el <b>Modo instructor</b>.</p>',
      confirmText: 'Entendido'
    });
    return;
  }

  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, n);

  Object.assign(examState, {
    active: true,
    challenges: selected,
    index: 0,
    results: {},
    startedAt: Date.now()
  });

  uiState.currentChallengeId = selected[0].id;
  uiState.currentSQL = '';
  uiState.lastResult = null;
  uiState.showSolution = false;
  uiState.feedback = {
    type: 'info',
    message: 'Examen iniciado: ' + n + ' retos al azar. Sin pistas ni solución. Cada reto 100 pts, −50 por intento fallido.'
  };

  startTimer();
  renderApp();
}

function exitExam(){
  resetTimer();
  Object.assign(examState, {
    active: false,
    challenges: [],
    index: 0,
    results: {},
    startedAt: null
  });

  const instr = document.querySelector('.instructor-bar');
  const footer = document.querySelector('.footer-actions');
  if(instr) instr.style.display = '';
  if(footer) footer.style.display = '';

  const first = getFirstUnlockedChallenge();
  uiState.currentChallengeId = first ? first.id : null;
  uiState.currentSQL = '';
  uiState.lastResult = null;
  uiState.showSolution = false;
  uiState.feedback = null;

  renderApp();
}

async function actionExitExam(){
  const ok = await confirmModal({
    title: 'Salir del examen',
    body: '<p>Si sales ahora, <b>perderás el progreso del examen actual</b> (no se guarda). ¿Continuar?</p>',
    confirmText: 'Salir del examen',
    danger: true
  });
  if(ok !== true) return;
  exitExam();
}

function renderExamBanner(){
  const total = examState.challenges.length;
  const answered = Object.keys(examState.results).length;
  const correct = Object.values(examState.results).filter(r => r.correct).length;
  const totalScore = Object.values(examState.results).reduce((a, r) => a + r.bestScore, 0);

  return '<div class="exam-banner">' +
    '<div>' +
      '<b>🎯 Examen</b> · Reto <b>' + (examState.index + 1) + '/' + total + '</b>' +
      ' · Contestados: <b>' + answered + '/' + total + '</b>' +
      ' · Aciertos: <b>' + correct + '</b>' +
      ' · Pts examen: <b>' + totalScore + '</b>' +
    '</div>' +
    '<button class="btn-danger" data-action="exit-exam">Salir del examen</button>' +
  '</div>';
}

function actionRunExam(){
  const c = examState.challenges[examState.index];
  if(!c) return;

  const sql = ($('editor')?.value ?? uiState.currentSQL ?? '').trim();
  uiState.currentSQL = sql;
  if(!sql){
    uiState.feedback = { type: 'err', message: 'Escribe una consulta antes de ejecutar.' };
    renderApp();
    return;
  }

  const result = validateQuery(c, sql);
  uiState.lastResult = result.actual;

  const rec = examState.results[c.id] || (examState.results[c.id] = { attempts: 0, correct: false, bestScore: 0 });
  rec.attempts++;

  if(result.correct){
    const score = Math.max(0, 100 - 50 * (rec.attempts - 1));
    if(score > rec.bestScore) rec.bestScore = score;
    rec.correct = true;
    uiState.feedback = { type: 'ok', message: '¡Correcto! +' + score + ' pts. Pulsa "Siguiente reto".' };
  } else {
    let msg = result.message;
    if(result.reason === 'error') msg = 'Error de SQL: ' + msg;
    uiState.feedback = { type: 'err', message: msg };
  }
  renderApp();
}

function actionNextExam(){
  if(examState.index < examState.challenges.length - 1){
    examState.index++;
    const c = examState.challenges[examState.index];
    uiState.currentChallengeId = c.id;
    uiState.currentSQL = '';
    uiState.lastResult = null;
    uiState.showSolution = false;
    uiState.feedback = null;
    renderApp();
  } else {
    finishExam();
  }
}

function finishExam(){
  const total = examState.challenges.length;
  const results = examState.results;
  const answered = Object.keys(results).length;
  const correct = Object.values(results).filter(r => r.correct).length;
  const totalScore = Object.values(results).reduce((a, r) => a + r.bestScore, 0);
  const maxScore = total * 100;
  const duration = examState.startedAt
    ? Math.round((Date.now() - examState.startedAt) / 1000)
    : 0;

  const snapshot = {
    total, answered, correct, totalScore, maxScore, duration,
    items: examState.challenges.map(c => ({
      id: c.id,
      title: c.title,
      result: results[c.id] || null
    }))
  };

  const examHTML = buildExamReportHTML(snapshot);
  const filename = 'SQLLab_Examen_' + new Date().toISOString().slice(0, 10) + '.html';

  exitExam();

  const rowsHTML = snapshot.items.map((it, i) => {
    const r = it.result;
    const estado = r
      ? (r.correct ? '✓ Acierto' : '✗ ' + r.attempts + ' intento' + (r.attempts === 1 ? '' : 's'))
      : '— sin contestar';
    const pts = r ? r.bestScore : 0;
    const color = r ? (r.correct ? '#107C41' : '#b03030') : '#888';
    return '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td><code style="font-size:11.5px;color:#107C41">' + it.id + '</code> ' + escapeHtml(it.title) + '</td>' +
      '<td style="color:' + color + ';font-weight:600">' + estado + '</td>' +
      '<td style="text-align:right">' + pts + '</td>' +
    '</tr>';
  }).join('');

  const pct = maxScore > 0 ? Math.round((totalScore / maxScore) * 100) : 0;

  openModal({
    title: '🎯 Examen terminado',
    body:
      '<p style="margin-bottom:12px">' +
        'Contestados <b>' + answered + '/' + total + '</b> · ' +
        'Aciertos <b>' + correct + '</b> · ' +
        'Puntuación <b>' + totalScore + '/' + maxScore + '</b> (' + pct + '%) · ' +
        'Duración <b>' + Math.floor(duration / 60) + 'm ' + (duration % 60) + 's</b>' +
      '</p>' +
      '<div style="max-height:340px;overflow-y:auto;border:1px solid #e8ecef;border-radius:6px">' +
        '<table style="width:100%;border-collapse:collapse;font-size:12.5px">' +
          '<thead><tr style="background:#e8f3ed;color:#1c5c39;position:sticky;top:0">' +
            '<th style="padding:6px;text-align:left">#</th>' +
            '<th style="padding:6px;text-align:left">Reto</th>' +
            '<th style="padding:6px;text-align:left">Estado</th>' +
            '<th style="padding:6px;text-align:right">Pts</th>' +
          '</tr></thead>' +
          '<tbody>' + rowsHTML + '</tbody>' +
        '</table>' +
      '</div>',
    confirmText: '📄 Descargar reporte',
    cancelText: 'Cerrar'
  }).then(r => {
    if(r === true) downloadHTML(filename, examHTML);
  });
}

/* ── Wrapper de renderChallenge para modo examen ── */
const _origRenderChallenge = renderChallenge;
renderChallenge = function(){
  _origRenderChallenge();
  if(!examState.active) return;

  const area = $('challengeArea');
  if(!area) return;

  const wrap = document.createElement('div');
  wrap.innerHTML = renderExamBanner();
  area.prepend(wrap.firstElementChild);

  const meta = area.querySelector('.challenge-meta');
  if(meta){
    const c = examState.challenges[examState.index];
    meta.textContent = '🎯 Examen · Reto ' + (examState.index + 1) + '/' +
                        examState.challenges.length + ' · ' + c.id;
  }

  area.querySelector('[data-action="hint"]')?.remove();
  area.querySelector('[data-action="solution"]')?.remove();

  const nextBtn = area.querySelector('[data-action="next"]');
  if(nextBtn){
    nextBtn.textContent = (examState.index === examState.challenges.length - 1)
      ? 'Terminar examen →'
      : 'Siguiente reto →';
  }
};

   REPORTES HTML

function downloadHTML(filename, htmlString){
  const blob = new Blob([htmlString], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function selfTestSQL(){
  const tests = [
    { name: 'SELECT *', sql: 'SELECT * FROM empleados' },
    { name: 'WHERE',    sql: "SELECT nombre FROM empleados WHERE depto_id = 1" },
    { name: 'Agregado', sql: 'SELECT COUNT(*) FROM empleados' },
    { name: 'Error',    sql: 'SELEC * FROM empleados' }
  ];
  console.group('%c🧪 selfTestSQL()', 'color:#107C41;font-weight:bold');
  for(const t of tests){
    const r = runUserSQL(t.sql);
    if(r.error) console.warn('❌ ' + t.name + ' → ' + r.error);
    else console.log('✅ ' + t.name + ' →', r.columns, r.rows);
  }
  console.groupEnd();
  return '✅ selfTestSQL OK';
}

function selfTestValidate(){
  const b1 = CHALLENGES.basico.find(c => c.id === 'b01');
  const b4 = CHALLENGES.basico.find(c => c.id === 'b04');
  const tests = [
    { name: 'b01 correcta',  ch: b1, sql: 'SELECT nombre, salario FROM empleados', want: true },
    { name: 'b01 invertida', ch: b1, sql: 'SELECT salario, nombre FROM empleados', want: false },
    { name: 'b04 sin ORDEN', ch: b4, sql: 'SELECT nombre, salario FROM empleados', want: false },
    { name: 'b04 con ORDEN', ch: b4, sql: 'SELECT nombre, salario FROM empleados ORDER BY salario ASC', want: true }
  ];
  console.group('%c🧪 selfTestValidate()', 'color:#107C41;font-weight:bold');
  let pass = 0, fail = 0;
  for(const t of tests){
    const r = validateQuery(t.ch, t.sql);
    const ok = (r.correct === t.want);
    if(ok){ console.log('✅ ' + t.name + ' → correct=' + r.correct); pass++; }
    else  { console.warn('❌ ' + t.name + ' → correct=' + r.correct + ' (esperado ' + t.want + ') — ' + r.message); fail++; }
  }
  console.groupEnd();
  console.log('Resultado: ' + pass + ' OK, ' + fail + ' KO');
  return pass + '/' + tests.length + ' OK';
}

REF_PARTS.push(`
<div class="ref-section">
<h2>🎯 ¿Qué es SQL?</h2>
<p>SQL (Structured Query Language) es el lenguaje estándar para <b>consultar y manipular</b> bases de datos relacionales. Una base de datos es un conjunto de <b>tablas</b>; cada tabla tiene <b>filas</b> (registros) y <b>columnas</b> (campos).</p>
<p>En este laboratorio la base tiene 3 tablas:</p>
<ul class="ref-list">
  <li><code>empleados</code> (id, nombre, apellido, depto_id, salario, fecha_ingreso)</li>
  <li><code>departamentos</code> (id, nombre)</li>
  <li><code>ventas</code> (id, empleado_id, monto, fecha)</li>
</ul>
</div>

<div class="ref-section">
<h2>📋 Anatomía de un SELECT</h2>
<pre class="ref-code">SELECT nombre, salario
FROM   empleados
WHERE  salario &gt; 3000
ORDER BY salario DESC
LIMIT 5;</pre>
<table class="ref-clauses">
<thead><tr><th>Cláusula</th><th>Función</th><th>Orden</th></tr></thead>
<tbody>
<tr><td><code>SELECT</code></td><td>Qué columnas devolver</td><td>1º</td></tr>
<tr><td><code>FROM</code></td><td>De qué tabla(s)</td><td>2º</td></tr>
<tr><td><code>WHERE</code></td><td>Filtra filas individuales</td><td>3º</td></tr>
<tr><td><code>GROUP BY</code></td><td>Agrupa filas para agregados</td><td>4º</td></tr>
<tr><td><code>HAVING</code></td><td>Filtra grupos (después de agrupar)</td><td>5º</td></tr>
<tr><td><code>ORDER BY</code></td><td>Ordena el resultado</td><td>6º</td></tr>
<tr><td><code>LIMIT</code></td><td>Limita cuántas filas devolver</td><td>7º</td></tr>
</tbody>
</table>
<div class="ref-tip">💡 El orden es <b>obligatorio</b>. No puedes poner ORDER BY antes de WHERE.</div>
</div>

<div class="ref-section">
<h2>📌 SELECT y FROM</h2>

<div class="ref-item">
<h3>Columnas específicas</h3>
<pre class="ref-code">SELECT nombre, salario FROM empleados;</pre>
</div>

<div class="ref-item">
<h3>Todas las columnas con *</h3>
<pre class="ref-code">SELECT * FROM empleados;</pre>
<p>Útil para explorar, pero en producción conviene listar solo las que necesitas.</p>
</div>

<div class="ref-item">
<h3>Alias con AS</h3>
<pre class="ref-code">SELECT nombre AS empleado, salario * 12 AS salario_anual FROM empleados;</pre>
<p>Renombra la columna en el resultado. También acepta expresiones.</p>
</div>

<div class="ref-item">
<h3>DISTINCT — sin duplicados</h3>
<pre class="ref-code">SELECT DISTINCT depto_id FROM empleados;</pre>
</div>
</div>

<div class="ref-section">
<h2>🔍 WHERE — filtrar filas</h2>
<p>La condición se evalúa <b>fila por fila</b>. Las que devuelvan TRUE se quedan en el resultado.</p>

<div class="ref-item">
<h3>Comparación</h3>
<pre class="ref-code">SELECT * FROM empleados WHERE salario &gt; 3000;
SELECT * FROM empleados WHERE depto_id = 2;
SELECT * FROM empleados WHERE nombre &lt;&gt; 'Ana';  -- distinto</pre>
<table class="ref-clauses">
<thead><tr><th>Operador</th><th>Significado</th></tr></thead>
<tbody>
<tr><td><code>=</code></td><td>Igual</td></tr>
<tr><td><code>&lt;&gt;</code> o <code>!=</code></td><td>Distinto</td></tr>
<tr><td><code>&gt;</code> / <code>&lt;</code></td><td>Mayor / menor</td></tr>
<tr><td><code>&gt;=</code> / <code>&lt;=</code></td><td>Mayor o igual / menor o igual</td></tr>
</tbody>
</table>
</div>

<div class="ref-item">
<h3>AND / OR / NOT</h3>
<pre class="ref-code">SELECT * FROM empleados WHERE salario &gt; 3000 AND depto_id = 2;
SELECT * FROM empleados WHERE depto_id = 1 OR depto_id = 2;
SELECT * FROM empleados WHERE NOT depto_id = 1;</pre>
<p>AND = ambas condiciones · OR = al menos una · NOT = negación. Puedes usar paréntesis.</p>
</div>

<div class="ref-item">
<h3>LIKE — buscar por patrón</h3>
<pre class="ref-code">WHERE nombre LIKE 'A%'        -- empieza con A
WHERE nombre LIKE '%a'        -- termina con a
WHERE nombre LIKE '%ar%'      -- contiene "ar"
WHERE nombre LIKE 'A_a'       -- A + cualquier carácter + a</pre>
<p><code>%</code> = cualquier cantidad de caracteres · <code>_</code> = exactamente un carácter.</p>
</div>

<div class="ref-item">
<h3>IN — lista de valores</h3>
<pre class="ref-code">WHERE depto_id IN (1, 2, 3)
WHERE nombre IN ('Ana', 'Luis', 'Marta')</pre>
<p>Equivale a varios OR encadenados.</p>
</div>

<div class="ref-item">
<h3>BETWEEN — rango inclusivo</h3>
<pre class="ref-code">WHERE salario BETWEEN 2000 AND 4000</pre>
<p>Incluye ambos extremos. Equivale a <code>salario &gt;= 2000 AND salario &lt;= 4000</code>.</p>
</div>

<div class="ref-item">
<h3>IS NULL / IS NOT NULL</h3>
<pre class="ref-code">WHERE depto_id IS NULL       -- empleados sin depto
WHERE depto_id IS NOT NULL   -- con depto asignado</pre>
<p>No uses <code>= NULL</code>: nunca devuelve filas. Siempre <code>IS NULL</code>.</p>
</div>
</div>

<div class="ref-section">
<h2>🔢 ORDER BY y LIMIT</h2>

<div class="ref-item">
<h3>Orden ascendente / descendente</h3>
<pre class="ref-code">SELECT nombre, salario FROM empleados ORDER BY salario ASC;   -- menor a mayor
SELECT nombre, salario FROM empleados ORDER BY salario DESC;  -- mayor a menor</pre>
<p>Sin ASC ni DESC, el defecto es ASC.</p>
</div>

<div class="ref-item">
<h3>Múltiples columnas</h3>
<pre class="ref-code">ORDER BY depto_id ASC, salario DESC</pre>
<p>Primero agrupa por depto_id; dentro de cada depto ordena por salario descendente.</p>
</div>

<div class="ref-item">
<h3>LIMIT</h3>
<pre class="ref-code">SELECT nombre, salario FROM empleados ORDER BY salario DESC LIMIT 3;</pre>
<p>Devuelve solo las 3 primeras filas. Combinado con ORDER BY = "top N".</p>
</div>
</div>
`);

REF_PARTS.push(`
<div class="ref-section">
<h2>📊 Funciones de agregado</h2>
<p>Devuelven <b>un solo valor</b> a partir de muchas filas. Son la base de cualquier análisis.</p>

<div class="ref-item">
<h3>Las 5 funciones principales</h3>
<table class="ref-clauses">
<thead><tr><th>Función</th><th>Qué hace</th><th>Ejemplo</th></tr></thead>
<tbody>
<tr><td><code>COUNT(*)</code></td><td>Cuenta filas (incluye NULLs)</td><td><code>SELECT COUNT(*) FROM empleados;</code></td></tr>
<tr><td><code>COUNT(col)</code></td><td>Cuenta filas <b>no nulas</b> de col</td><td><code>SELECT COUNT(depto_id) FROM empleados;</code></td></tr>
<tr><td><code>SUM(col)</code></td><td>Suma los valores</td><td><code>SELECT SUM(salario) FROM empleados;</code></td></tr>
<tr><td><code>AVG(col)</code></td><td>Promedio (ignora NULLs)</td><td><code>SELECT AVG(salario) FROM empleados;</code></td></tr>
<tr><td><code>MIN(col)</code></td><td>Valor mínimo</td><td><code>SELECT MIN(salario) FROM empleados;</code></td></tr>
<tr><td><code>MAX(col)</code></td><td>Valor máximo</td><td><code>SELECT MAX(salario) FROM empleados;</code></td></tr>
</tbody>
</table>
</div>

<div class="ref-item">
<h3>Varios agregados en una sola fila</h3>
<pre class="ref-code">SELECT COUNT(*) AS total,
       AVG(salario) AS promedio,
       MAX(salario) AS maximo,
       MIN(salario) AS minimo
FROM empleados;</pre>
<p>Devuelve <b>una única fila</b> con los 4 valores.</p>
</div>

<div class="ref-item">
<h3>COUNT(*) vs COUNT(col) — cuidado con los NULL</h3>
<pre class="ref-code">-- empleados: 8 filas, 1 con depto_id = NULL
SELECT COUNT(*)       FROM empleados;  -- 8  (cuenta todas las filas)
SELECT COUNT(depto_id) FROM empleados; -- 7  (ignora la fila con NULL)</pre>
<div class="ref-tip">💡 Regla de oro: <b>COUNT(*)</b> = filas · <b>COUNT(col)</b> = filas donde col NO es NULL.</div>
</div>

<div class="ref-item">
<h3>Agregados con WHERE</h3>
<pre class="ref-code">SELECT COUNT(*) AS empleados_ti, AVG(salario) AS promedio_ti
FROM empleados
WHERE depto_id = 2;</pre>
<p>El WHERE filtra filas <b>antes</b> de calcular el agregado.</p>
</div>
</div>

<div class="ref-section">
<h2>📦 GROUP BY y HAVING</h2>
<p><b>GROUP BY</b> divide las filas en grupos que comparten un valor. Aplica el agregado <b>por grupo</b>, devolviendo una fila por grupo.</p>

<div class="ref-item">
<h3>Sintaxis</h3>
<pre class="ref-code">SELECT depto_id, COUNT(*) AS empleados, AVG(salario) AS prom
FROM empleados
GROUP BY depto_id;</pre>
<p>Devuelve <b>una fila por departamento</b>.</p>
</div>

<div class="ref-item">
<h3>Regla de oro</h3>
<p>Toda columna del SELECT que <b>no</b> esté dentro de un agregado debe aparecer en el GROUP BY:</p>
<pre class="ref-code">-- ✔ válido
SELECT depto_id, COUNT(*) FROM empleados GROUP BY depto_id;

-- ✘ inválido: nombre no está en el GROUP BY ni en un agregado
SELECT nombre, COUNT(*) FROM empleados GROUP BY depto_id;</pre>
</div>

<div class="ref-item">
<h3>HAVING — filtrar grupos</h3>
<pre class="ref-code">SELECT depto_id, COUNT(*) AS empleados
FROM empleados
GROUP BY depto_id
HAVING COUNT(*) &gt;= 3;</pre>
<p><b>HAVING</b> filtra grupos ya formados. <b>WHERE</b> filtra filas antes de agrupar.</p>
</div>

<div class="ref-item">
<h3>WHERE y HAVING juntos</h3>
<pre class="ref-code">SELECT depto_id, AVG(salario) AS prom
FROM empleados
WHERE salario &gt; 2000        -- primero filtra filas
GROUP BY depto_id
HAVING AVG(salario) &gt; 3000; -- luego filtra grupos</pre>
</div>

<div class="ref-item">
<h3>HAVING con alias (truco)</h3>
<pre class="ref-code">SELECT depto_id, SUM(salario) AS total
FROM empleados
GROUP BY depto_id
HAVING total &gt; 10000;   -- funciona en SQLite / MySQL</pre>
<div class="ref-tip">💡 SQL estándar exige repetir el agregado en HAVING. <code>HAVING SUM(salario) &gt; 10000</code> es más portable.</div>
</div>
</div>

<div class="ref-section">
<h2>🔗 JOINs — combinar tablas</h2>
<p>Un <b>JOIN</b> une filas de dos tablas cuando una condición se cumple. Normalmente esa condición es una <b>clave foránea</b> (ej. <code>empleados.depto_id = departamentos.id</code>).</p>

<div class="ref-item">
<h3>INNER JOIN — solo coincidencias</h3>
<pre class="ref-code">SELECT e.nombre AS empleado, d.nombre AS depto
FROM empleados e
INNER JOIN departamentos d ON e.depto_id = d.id;</pre>
<p>Si un empleado tiene <code>depto_id = NULL</code>, ese empleado <b>no aparece</b>.</p>
</div>

<div class="ref-item">
<h3>LEFT JOIN — todas las filas de la izquierda</h3>
<pre class="ref-code">SELECT e.nombre AS empleado, d.nombre AS depto
FROM empleados e
LEFT JOIN departamentos d ON e.depto_id = d.id;</pre>
<p>Los empleados con <code>depto_id = NULL</code> <b>sí aparecen</b>; la columna <code>depto</code> sale como NULL.</p>
<div class="ref-tip">💡 <b>LEFT JOIN + IS NULL</b> es la forma clásica de encontrar "los que NO tienen par": <code>WHERE d.id IS NULL</code>.</div>
</div>

<div class="ref-item">
<h3>Alias de tabla — imprescindibles en JOINs</h3>
<pre class="ref-code">FROM empleados e
JOIN departamentos d ON e.depto_id = d.id</pre>
<p>Cuando dos tablas tienen una columna con el mismo nombre (por ejemplo <code>nombre</code>), usa el alias: <code>e.nombre</code> vs <code>d.nombre</code>.</p>
</div>

<div class="ref-item">
<h3>Más de 2 tablas</h3>
<pre class="ref-code">SELECT d.nombre, e.nombre AS empleado, SUM(v.monto) AS total
FROM departamentos d
JOIN empleados e ON d.id = e.depto_id
JOIN ventas    v ON e.id = v.empleado_id
GROUP BY d.id, d.nombre, e.id, e.nombre;</pre>
<p>Encadena tantos JOINs como necesites. Cada uno añade una tabla con su ON.</p>
</div>

<div class="ref-item">
<h3>Doble LEFT JOIN + COALESCE</h3>
<pre class="ref-code">SELECT d.nombre AS depto,
       COALESCE(SUM(v.monto), 0) AS total_ventas
FROM departamentos d
LEFT JOIN empleados e ON d.id = e.depto_id
LEFT JOIN ventas    v ON e.id = v.empleado_id
GROUP BY d.id, d.nombre;</pre>
<p>Los departamentos sin ventas aparecen con <b>0</b> en lugar de NULL.</p>
</div>
</div>

<div class="ref-section">
<h2>🔤 Funciones escalares (texto y números)</h2>
<p>Se aplican <b>fila por fila</b> y devuelven un valor por cada fila.</p>

<div class="ref-item">
<h3>Texto</h3>
<table class="ref-clauses">
<thead><tr><th>Función</th><th>Qué hace</th><th>Ejemplo</th></tr></thead>
<tbody>
<tr><td><code>UPPER(s)</code></td><td>Mayúsculas</td><td><code>UPPER(nombre)</code></td></tr>
<tr><td><code>LOWER(s)</code></td><td>Minúsculas</td><td><code>LOWER(nombre)</code></td></tr>
<tr><td><code>LENGTH(s)</code></td><td>Largo en caracteres</td><td><code>LENGTH(nombre)</code></td></tr>
<tr><td><code>CONCAT(a,b,…)</code></td><td>Une textos</td><td><code>CONCAT(nombre,' ',apellido)</code></td></tr>
<tr><td><code>SUBSTR(s,p,n)</code></td><td>Subcadena desde p, n caracteres</td><td><code>SUBSTR(nombre,1,3)</code></td></tr>
<tr><td><code>TRIM(s)</code></td><td>Quita espacios extremos</td><td><code>TRIM(nombre)</code></td></tr>
</tbody>
</table>
<pre class="ref-code">SELECT UPPER(nombre) AS nombre_mayus,
       CONCAT(nombre, ' ', apellido) AS nombre_completo
FROM empleados;</pre>
</div>

<div class="ref-item">
<h3>Número</h3>
<table class="ref-clauses">
<thead><tr><th>Función</th><th>Qué hace</th><th>Ejemplo</th></tr></thead>
<tbody>
<tr><td><code>ROUND(v,n)</code></td><td>Redondea a n decimales</td><td><code>ROUND(salario/12, 2)</code></td></tr>
<tr><td><code>ABS(v)</code></td><td>Valor absoluto</td><td><code>ABS(a - b)</code></td></tr>
<tr><td><code>COALESCE(a,b,…)</code></td><td>Primer valor NO NULL</td><td><code>COALESCE(depto_id, 0)</code></td></tr>
</tbody>
</table>
<pre class="ref-code">SELECT nombre,
       ROUND(salario / 22, 2) AS salario_por_dia
FROM empleados;</pre>
</div>
</div>

<div class="ref-section">
<h2>🎨 CASE WHEN — condicional por fila</h2>
<p>Es el <b>if/else de SQL</b>. Devuelve un valor por cada fila según una condición.</p>

<div class="ref-item">
<h3>Sintaxis</h3>
<pre class="ref-code">CASE
  WHEN cond1 THEN valor1
  WHEN cond2 THEN valor2
  ELSE valor_default
END</pre>
<p>Los WHEN se evalúan <b>en orden</b>: el primero que se cumple gana. Puedes omitir ELSE; en ese caso el resultado es NULL si nada coincide.</p>
</div>

<div class="ref-item">
<h3>Clasificación simple</h3>
<pre class="ref-code">SELECT nombre, salario,
  CASE
    WHEN salario &gt;= 4000 THEN 'Alto'
    WHEN salario &gt;= 2500 THEN 'Medio'
    ELSE 'Bajo'
  END AS categoria
FROM empleados;</pre>
</div>

<div class="ref-item">
<h3>Pivot con SUM(CASE WHEN …)</h3>
<pre class="ref-code">SELECT
  SUM(CASE WHEN depto_id = 1 THEN 1 ELSE 0 END) AS ventas_depto,
  SUM(CASE WHEN depto_id = 2 THEN 1 ELSE 0 END) AS ti_depto
FROM empleados;</pre>
<p>Truco clásico: "cuenta condicional". Combinado con GROUP BY, obtienes una tabla pivot.</p>
</div>
</div>

<div class="ref-section">
<h2>🔍 Subconsultas</h2>
<p>Un <b>SELECT</b> dentro de otro SELECT. Siempre van entre paréntesis.</p>

<div class="ref-item">
<h3>Subconsulta escalar — devuelve UN valor</h3>
<pre class="ref-code">SELECT nombre, salario
FROM empleados
WHERE salario &gt; (SELECT AVG(salario) FROM empleados);</pre>
<p>La subconsulta se evalúa primero; su resultado es el umbral del WHERE.</p>
</div>

<div class="ref-item">
<h3>Subconsulta con IN — devuelve una lista</h3>
<pre class="ref-code">SELECT nombre
FROM empleados
WHERE depto_id IN (SELECT id FROM departamentos WHERE nombre = 'TI');</pre>
<p>El resultado del IN es la lista de ids que devuelve la subconsulta.</p>
</div>

<div class="ref-item">
<h3>Subconsulta con NOT IN — los que NO están</h3>
<pre class="ref-code">SELECT nombre
FROM empleados
WHERE id NOT IN (SELECT empleado_id FROM ventas);</pre>
<p>Empleados que no tienen ninguna venta. Alternativa al <code>LEFT JOIN … IS NULL</code>.</p>
<div class="ref-tip">⚠️ Con NOT IN, si la subconsulta devuelve <b>algún NULL</b>, el resultado global es siempre vacío. Usa <code>NOT EXISTS</code> si puedes haber NULLs.</div>
</div>
</div>

<div class="ref-section">
<h2>💡 Consejos y errores comunes</h2>

<div class="ref-item">
<h3>Comillas simples para texto</h3>
<pre class="ref-code">WHERE nombre = 'Ana'   -- ✔ correcto
WHERE nombre = "Ana"   -- ✘ algunos motores lo tratan como columna</pre>
<p>Comillas simples para strings. Comillas dobles suelen ser para identificadores.</p>
</div>

<div class="ref-item">
<h3>NULL no se compara con =</h3>
<pre class="ref-code">WHERE depto_id = NULL       -- ✘ nunca devuelve filas
WHERE depto_id IS NULL      -- ✔
WHERE depto_id IS NOT NULL  -- ✔</pre>
</div>

<div class="ref-item">
<h3>Orden obligatorio de cláusulas</h3>
<pre class="ref-code">SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY … LIMIT …</pre>
<p>Saltarte el orden produce error de sintaxis.</p>
</div>

<div class="ref-item">
<h3>El WHERE NO puede usar agregados</h3>
<pre class="ref-code">WHERE SUM(salario) &gt; 100     -- ✘ error
HAVING SUM(salario) &gt; 100    -- ✔ después de GROUP BY</pre>
</div>

<div class="ref-item">
<h3>Columnas con el mismo nombre en JOINs</h3>
<pre class="ref-code">SELECT nombre FROM empleados e JOIN departamentos d …</pre>
<p>Ambas tablas tienen <code>nombre</code>. Usa alias: <code>e.nombre</code> / <code>d.nombre</code> y <code>AS</code> en el SELECT.</p>
</div>

<div class="ref-item">
<h3>Alias con o sin AS</h3>
<pre class="ref-code">SELECT nombre AS empleado FROM empleados;   -- ✔ recomendado
SELECT nombre empleado       FROM empleados; -- ✔ también vale
SELECT nombre as "Empleado"  FROM empleados; -- comillas si lleva espacios</pre>
</div>

<div class="ref-item">
<h3>Comentarios</h3>
<pre class="ref-code">-- comentario de una línea
/* comentario
   de varias líneas */</pre>
</div>
</div>
